[package]
name = "ys-ntfs-parser-mft"
description = "A Fast (and safe) parser for the Windows Master File Table (MFT) format"
homepage = "https://github.com/Yamato-Security/ys-ntfs-parser"
repository = "https://github.com/Yamato-Security/ys-ntfs-parser"
license = "RPL-1.5 AND (MIT OR Apache-2.0)"
readme = "README.md"

version = "1.0.0"
# Yamato Security's fork of the upstream `mft` crate: not published under the upstream name.
publish = false
authors = ["Omer Ben-Amram", "Zach Mathis (@yamatosecurity)"]
edition = "2024"
rust-version = "1.99"
# samples/ is packaged: the unit tests and the benchmark read it.
include = ["/src/", "/samples/", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

# The library keeps upstream's name, so code using it reads `use mft::…`.
[lib]
name = "mft"

[dependencies]
log = "0.4"
byteorder = "1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
thiserror = "2"
num-traits = "0.2"
num-derive = "0.5"
winstructs = "0.3.2"
lru = "0.19.0"
itertools = "0.15"
jiff = { version = "0.2.38", default-features = false, features = ["std", "alloc", "serde", "perf-inline"] }

utf16-simd = "0.1.1"

[dev-dependencies]
criterion = "0.8"
doc-comment = "0.3"
env_logger = "0.11"
insta = "1.49"

[[bench]]
name = "benchmark"
path = "./src/benches/benchmark.rs"
harness = false
