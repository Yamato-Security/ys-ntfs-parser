[package]
name = "ys-ntfs-parser-usn"
version = "1.0.0"
authors = ["Florian Amette", "Zach Mathis (@yamatosecurity)"]
# Yamato Security's fork of the upstream `sootmark-usn` crate: not published under the upstream name.
publish = false
edition = "2024"
rust-version = "1.99"
description = "NTFS USN change journal ($UsnJrnl:$J): every V2, V3 and V4 record, read straight through sparse zeros and damage, with reasons, references, names, paths rewound to each record's time, and carving."
license = "RPL-1.5 AND (MIT OR Apache-2.0)"
repository = "https://github.com/Yamato-Security/ys-ntfs-parser"
homepage = "https://github.com/Yamato-Security/ys-ntfs-parser"
keywords = ["forensics", "dfir", "incident-response", "ntfs", "usn"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "usn"

[features]
# PathBuilder::seed_from_mft, with the workspace's mft crate (mft/).
mft = ["dep:mft"]

[dependencies]
# The byte cursor, UTF-16 decoding and FILETIMEs shared with the other crates (common/).
ntfs-common = { package = "ys-ntfs-parser-common", path = "../common" }
mft = { package = "ys-ntfs-parser-mft", path = "../mft", optional = true }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
